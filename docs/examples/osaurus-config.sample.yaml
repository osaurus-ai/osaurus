# Osaurus declarative configuration — annotated sample.
#
# A realistic document touching every section. Apply it with the chat
# assistant ("apply this configuration"), the CLI
# (`osaurus config apply osaurus-config.sample.yaml`), or the loopback
# HTTP API (`POST /admin/config/plan` / `/apply`).
#
# Semantics (see the in-app "config" help topic for the full contract):
#   * Merge by default — absent keys stay untouched; explicit null clears
#     an optional override.
#   * Entities match by name (case-insensitive); listed entries are
#     created if missing, patched if present.
#   * Deleting is opt-in: apply with the prune tool/CLI argument and only
#     the entries you KEEP listed. Prune is never a document key.
#   * Secrets never appear here — use env:VAR / keychain:SERVICE/ACCOUNT
#     references or `set_api_key: true` for the native credential sheet.
#   * Server runtime settings are managed in the Settings UI, not in this
#     document. `chat` and `app` cover a small set of everyday switches.
#
# This file is pinned by ConfigSampleDocumentTests: it must decode and
# strict-validate against the live schema, so it cannot silently rot.

version: 1

memory: # cross-chat conversation memory
  enabled: true
  budget_tokens: 1200 # 100..4000
  retention_days: 365 # 0..3650 (0 = forever)

harness_runtimes: # external agent harnesses (Settings → Runtimes); HIGH RISK: runs a local program
  - name: Pi
    kind: pi_rpc # claude_code | pi_rpc; immutable after create
    executable: pi # command on PATH, or a path
    arguments: ["--mode", "rpc", "--session-id", "{chat_id}"] # {chat_id} {agent_id} {cwd} {system_prompt_file}
    environment: {} # plain values only — never secrets

default_agent: # the built-in Default agent (the Orchestrator)
  name: null # custom display name; null = "Osaurus"
  model: foundation # "foundation", local id, or "<provider>/<model>"
  temperature: 0.7 # 0..2 or null
  max_tokens: null # null = automatic
  system_prompt: "You are a friendly, concise assistant."
  runtime: builtin # "builtin" or a harness_runtimes name

configurator: # the built-in helper behind configurator_handoff; its name is fixed
  model: null # same format as default_agent.model; null = the Orchestrator's model
  temperature: null # 0..2; null = the model's own default
  system_prompt: "Prefer the smallest change that does what I asked."

new_chat_agent: default # which agent NEW chats open with: "default" or a custom agent's name

model_defaults: # model roles from Models → Model Defaults
  core_model: foundation # titles, memory, follow-ups, transcript cleanup
  compaction_model: null # null = the chat's own model summarizes

chat: # everyday Chat page switches
  smooth_streaming: true
  group_activity: true
  expand_thinking: false
  spell_check: false
  auto_titles: true
  follow_up_suggestions: true
  clipboard_monitoring: true
  keep_mac_awake: true

app: # app basics from Settings → General
  hotkey: "cmd+;" # cmd/shift/option/ctrl + one key; null = no hotkey
  start_at_login: false
  show_notifications: true

agents: # custom agents (never the Default agent)
  - name: Research Agent
    description: "Web research with cited sources"
    system_prompt: "Research topics thoroughly and cite your sources."
    model: null # null inherits the Orchestrator's model
    temperature: 0.4
    max_tokens: 4096
    capabilities: # only provided keys change
      tools_enabled: true
      web_search_enabled: true
      knowledge_enabled: true
      knowledge_collection_ids: [] # UUIDs from the knowledge scope
      browser_use_enabled: false # HIGH RISK when enabled
      computer_use_enabled: false # HIGH RISK when enabled
      image_enabled: false # image generation/editing lives on custom agents
      applescript_enabled: false # AppleScript / mac_query lives on custom agents
      apple_apps: [] # built-in Apple app tools; full list replaces the set.
      # calendar | reminders | contacts | notes | mail | messages | maps | music | shortcuts
      # (mail / messages / shortcuts act on your behalf — the plan card flags them)
      relay_enabled: false # HIGH RISK: reachable from outside
    tools: # per-agent tool selection
      mode: manual # auto = RAG-picked, manual = only `enabled`
      enabled: [get_current_time, web_search] # MCP/plugin tools go under mcp_servers / plugins
    mcp_servers: # MCP server NAMES
      enabled: []
      disabled: []
    plugins: # plugin registry ids
      enabled: []
    sandbox: # autonomous code execution sandbox
      enabled: true
      network_enabled: true
      allowed_domains: [] # empty = unrestricted
    subagents: # per-agent delegation
      enabled: false
      agents: [] # agent NAMES this agent may spawn
      models: [] # raw model ids for spawn_model
    working_folder: null # folder PATH hint; the apply asks the user when it is missing

tools: # global tool enablement / permission policies
  enabled:
    web_search: true
  policies:
    file_write: ask # auto | ask | deny (auto is HIGH RISK)

delegation: # Orchestrator delegation: who it may spawn, permission, worker limits
  local_text_enabled: true
  spawnable_agents: ["Research Agent"] # replaces the pool
  spawnable_workspace_agents: [] # teammates' shared agents as Name@Workspace
  workspace_auto_join: {} # "<workspace>": false stops its shared agents auto-joining
  permission_defaults:
    spawn: always_allow # ask | deny | always_allow
    spawn_workspace: ask # teammates' shared agents ask by default
  budget_max_tokens: 8192 # 256..65536 per worker turn
  budget_max_turns: 24 # 1..100 tool-call rounds per worker
  budget_max_seconds: 900 # 15..3600
  ram_safety_preflight: true # false is HIGH RISK

commands: # user template slash commands (built-ins stay)
  - name: standup
    description: "Draft my standup update"
    icon: text.bubble # SF Symbol name
    template: "Draft a three-bullet standup update from this conversation."

knowledge_collections: # folder-backed knowledge collections
  - name: Team Docs
    folder_path: ~/Documents/TeamDocs # must exist; immutable after create
    summary: "Internal team documentation"
    enabled: true
    include_globs: ["**/*.md"] # replaces the list
    exclude_globs: ["**/drafts/**"] # replaces the list

channels: # channel routing (credentials/routes stay in Settings)
  write_enabled: true # global kill switch; re-enabling is HIGH RISK
  telegram:
    default_read_limit: 25 # 1..100 messages per read
    sender_allowlist: ["123456789"] # replaces the list
    require_mention: true
    bot_token_ref: env:TELEGRAM_BOT_TOKEN # write-only secret reference

mcp_servers: # user-added MCP servers (plugin-owned stay put)
  - name: GitHub
    transport: http # http | stdio; immutable after create
    url: https://api.githubcopilot.com/mcp/
    auth: bearer # none | bearer | oauth
    enabled: true
    token_ref: env:GITHUB_MCP_TOKEN # write-only secret reference
  - name: Filesystem
    transport: stdio # stdio launches a local process (HIGH RISK)
    command: /usr/local/bin/mcp-filesystem
    args: ["--root", "~/Projects"] # replaces the list
    env:
      NODE_ENV: production # plain env only
    secret_env_refs:
      API_TOKEN: env:FS_MCP_TOKEN # write-only: env KEY -> secret ref
    execution_host: sandbox # sandbox | host (host is HIGH RISK)
    enabled: true

models: # desired installed local MLX models (HF repo ids)
  - mlx-community/Qwen2.5-7B-Instruct-4bit

plugins: # desired installed plugins (registry ids). Apple apps are built in — see capabilities.apple_apps above.
  - osaurus.fetch

providers: # cloud LLM providers
  - name: Anthropic
    provider: anthropic # required to create; immutable after
    enabled: true
    auto_connect: true
    api_key_ref: env:ANTHROPIC_API_KEY # write-only secret reference
    # ...or use `set_api_key: true` for the interactive credential sheet.

search_providers:
  ranking: [tavily, ddg_scrape] # fallback order, first = primary
  providers:
    - id: tavily # keyed providers need the API key in Settings
      enabled: true

automations: # triggers; legacy `schedules:` / `watchers:` / `events:` still import
  - name: Morning news
    agent: Research Agent # a CUSTOM agent (never "default"), for tool work
    instructions: "Summarize the top technology headlines."
    source:
      kind: schedule # schedule | folder | webhook | rss | sse | run_failed | app
      frequency: daily # once | every_n_minutes | hourly | daily | weekly | monthly | yearly | cron
      frequency_time_of_day: "08:00" # HH:mm
    enabled: true

  - name: Downloads sorter
    agent: Research Agent
    instructions: "File new downloads into the right subfolder."
    source:
      kind: folder
      path: ~/Downloads # existing directory; ~ expands
      recursive: false
      responsiveness: balanced # fast | balanced | patient | relaxed | deferred | extended
    enabled: true

  - name: Weekday digest
    workflow: Daily Digest # an installed workflow; no agent needed
    input:
      day: "{{schedule.scheduled_for}}" # bind every required input
    source:
      kind: schedule
      frequency: cron
      frequency_value: "0 8 * * 1-5" # minute hour day-of-month month day-of-week

  - name: Morning quote
    instructions: "Give me one short motivational quote." # no agent or workflow: one tool-less model answer
    source:
      kind: schedule
      frequency: daily
      frequency_time_of_day: "07:30"
