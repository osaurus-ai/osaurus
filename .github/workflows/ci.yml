name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clear_cache:
        description: "Skip restoring the DerivedData cache (force a cold build)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bump to invalidate every cache entry without source surgery (e.g., after a
  # known-bad cache or an Xcode toolchain upgrade we want to flush manually).
  CACHE_SALT: v1
  # Pin Xcode so cache keys are stable across runner image bumps. When you
  # need to upgrade, change here AND in setup-xcode below.
  XCODE_VERSION: "26.3"

jobs:
  test-core:
    runs-on: macos-latest
    # Caps any future launch-hang at 15 min instead of burning 1h+ runners.
    # If we ever genuinely need longer, the right fix is to make tests faster
    # rather than raising this.
    timeout-minutes: 15
    env:
      WORKSPACE: osaurus.xcworkspace
      SPM_CACHE: .spm-cache
      XCRESULT_PATH: build/Tests.xcresult
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ runner.os }}-${{ env.CACHE_SALT }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('osaurus.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.CACHE_SALT }}-xcode${{ env.XCODE_VERSION }}-
            spm-${{ runner.os }}-${{ env.CACHE_SALT }}-

      - name: Restore DerivedData cache
        id: dd-cache
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.clear_cache }}
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-${{ runner.os }}-${{ env.CACHE_SALT }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('osaurus.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/*.swift', 'Packages/**/Package.swift', 'Packages/**/Resources/**') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ env.CACHE_SALT }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -workspace "$WORKSPACE"
          -scheme OsaurusCoreTests
          -clonedSourcePackagesDirPath "$SPM_CACHE"
          -quiet

      - name: Test OsaurusCore
        id: test
        run: |
          set -o pipefail
          mkdir -p build
          # We deliberately pass a dummy resultBundlePath check first because
          # xcodebuild refuses to overwrite an existing bundle.
          rm -rf "$XCRESULT_PATH"
          # Per-test-case allowance (60s / 120s hard cap) is what surfaces a
          # hung test BEFORE the 15-min job timeout — and crucially, surfaces
          # it WITH A NAME ATTACHED in the xcresult bundle, which the failure
          # summary step below relies on.
          #
          # Why no `--quiet` on xcbeautify and no `-test-iterations` here:
          # both were band-aids that landed during PR #878's launch-hang
          # incident. `--quiet` strips per-test "Started/Passed" lines so a
          # hung test that takes the entire 15-min job timeout produces no
          # output telling us WHICH test hung. `-test-iterations 2
          # -retry-tests-on-failure` doubles the wall-clock cost of every
          # hang (2 × 15 min = 30 min before the wall-timeout fires) for
          # zero diagnostic gain. Both are off by default — re-add only if
          # you have a per-PR reason and an exit plan.
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme OsaurusCoreTests \
            -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -resultBundlePath "$XCRESULT_PATH" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -enableCodeCoverage NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=incremental \
            | xcbeautify --renderer github-actions --is-ci

      - name: Annotate timing
        if: always()
        run: echo "::notice title=test-core duration::$SECONDS seconds"

      - name: Print failure summary
        if: failure()
        run: |
          set +e
          echo "## test-core failures" >> "$GITHUB_STEP_SUMMARY"

          # Three real failure modes we want to disambiguate, because PR #878
          # taught us that conflating them ("tests didn't start" when they
          # actually started and one hung) costs hours of diagnosis time:
          #
          # 1. No xcresult bundle  →  the build failed, OR xctest failed to
          #    launch at all (true dyld-time hang). Look at the build log
          #    above for compiler errors first; if the build succeeded,
          #    suspect a module-init hang in OsaurusCore or its deps.
          #
          # 2. xcresult exists, contains zero test cases  →  test execution
          #    was killed mid-flight (job wall-timeout, runner crash). The
          #    last test that started in the build log is the prime suspect
          #    for hanging — `--quiet` is intentionally NOT passed to
          #    xcbeautify above so that "Started" line is in the log.
          #
          # 3. xcresult exists, contains failed test cases  →  ordinary test
          #    failures; render them as a table.
          if [ ! -d "$XCRESULT_PATH" ]; then
            echo "_No xcresult bundle was produced. Either the build failed or the test bundle hung at launch (dyld load / module init). Check the **Test OsaurusCore** step log above for the last successful build phase before cancellation; if `Touch …xctest` was the last line, the hang is at xctest launch, not during a test._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `xcresulttool get test-results tests` is the modern (Xcode 16+)
          # JSON view of the test outcomes. Older flag is now deprecated.
          XCRESULT_JSON="$(xcrun xcresulttool get test-results tests \
            --path "$XCRESULT_PATH" \
            --format json 2>/dev/null)"

          # Count test cases regardless of outcome so we can detect the
          # "started, killed mid-flight" case where there are no Failure
          # nodes but also no Passed nodes.
          TEST_CASE_COUNT="$(printf '%s' "$XCRESULT_JSON" \
            | jq '[ .. | objects | select(.nodeType? == "Test Case" or .nodeType? == "Test") ] | length' \
            2>/dev/null || echo 0)"

          if [ "${TEST_CASE_COUNT:-0}" = "0" ]; then
            echo "_xcresult bundle exists but contains zero test cases. Test execution was killed before any test recorded a result — most likely a hung test that ate the 15-min job wall-timeout, or a runner crash. Check the build log for the last 'Test Case ... started' line; that's the prime suspect for the hang._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s' "$XCRESULT_JSON" | jq -r '
              [ .. | objects | select(.result? == "Failed" and (.nodeType? == "Test Case" or .nodeType? == "Test")) ]
              | if length == 0 then
                  "_No individual failed tests reported despite a non-zero exit. Likely a build error, post-test cleanup failure, or runner crash — see the raw log above._"
                else
                  ( "| Test | Failure |\n| --- | --- |" )
                  + ( map(
                      "| `" + (.name // "(unknown)") + "` | "
                      + ( ( [ .. | objects | select(.nodeType? == "Failure Message") | .name ] | join("<br>") )
                          // "_(no message)_" )
                      + " |"
                    ) | join("\n") )
                end
            ' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-core-xcresult-${{ github.run_attempt }}
          path: ${{ env.XCRESULT_PATH }}
          retention-days: 7
          if-no-files-found: warn

      # Save the cache only on `main` so a half-baked PR can never poison it.
      # If `clear_cache=true` was passed via workflow_dispatch we also skip the
      # save (the restore step didn't run, so `cache-primary-key` is empty);
      # the next normal `main` push will repopulate the cache.
      - name: Save DerivedData cache
        if: ${{ github.ref == 'refs/heads/main' && success() && steps.dd-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.dd-cache.outputs.cache-primary-key }}

  test-cli:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # OsaurusCLI's Package.swift requires `swift-tools-version: 6.2`, which
      # ships with Xcode 26.3. The runner's default `swift` may be older
      # (currently 6.1), so point xcrun at the pinned Xcode for these steps.
      # GitHub Actions doesn't let job-level `env:` reference workflow-level
      # `env:`, so keep XCODE_VERSION in sync here if it ever changes.
      - name: Verify Swift toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: swift --version

      - name: Run CLI tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
        run: swift test --package-path Packages/OsaurusCLI --parallel

      - name: Annotate timing
        if: always()
        run: echo "::notice title=test-cli duration::$SECONDS seconds"

  swiftlint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
